  api-gateway-1:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: exam-api-gateway-1
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      AUTH_SERVICE_URL: http://auth-service-1:8081,http://auth-service-2:8081
      EXAM_SERVICE_URL: http://exam-service-1:8082,http://exam-service-2:8082,http://exam-service-3:8082
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (base64, at least 32 bytes)}
      # The sites that may call the API (no "*" in production) and the proxies whose X-Forwarded-For
      # is believed by the rate limiter (nginx; without it all users share nginx's bucket)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (https://your-site, comma separated)}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:?GATEWAY_TRUSTED_PROXIES is required (the address or subnet of nginx)}
