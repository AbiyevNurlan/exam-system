      AUTH_INTERNAL_URL: http://auth-service-1:8081
      # Zone whose midnight starts a new day for the daily attempt limit of an exam
      EXAM_DAY_ZONE: ${EXAM_DAY_ZONE:-Asia/Baku}
      # Where the risk level of a session's fraud events turns MEDIUM, HIGH and CRITICAL (weighted sum)
      EXAM_FRAUD_RISK_MEDIUM: ${EXAM_FRAUD_RISK_MEDIUM:-5}
      EXAM_FRAUD_RISK_HIGH: ${EXAM_FRAUD_RISK_HIGH:-15}
      EXAM_FRAUD_RISK_CRITICAL: ${EXAM_FRAUD_RISK_CRITICAL:-30}
      # Question media: how this service reaches the storage, and the address inside presigned URLs
      MEDIA_S3_ENDPOINT: http://media-storage:8333
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:?MEDIA_S3_PUBLIC_ENDPOINT is required (https://your-site, where /exam-media/ reaches the storage)}
      MEDIA_S3_BUCKET: exam-media
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?MEDIA_S3_ACCESS_KEY is required}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?MEDIA_S3_SECRET_KEY is required}
      MEDIA_CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
