      GATEWAY_AUTH_REGISTER_BURST: ${GATEWAY_AUTH_REGISTER_BURST:-1000}
      GATEWAY_AUTH_LOGIN_RATE: ${GATEWAY_AUTH_LOGIN_RATE:-500}
      GATEWAY_AUTH_LOGIN_BURST: ${GATEWAY_AUTH_LOGIN_BURST:-1000}
      GATEWAY_OTP_REPLENISH: ${GATEWAY_OTP_REPLENISH:-1}
      GATEWAY_OTP_BURST: ${GATEWAY_OTP_BURST:-50}
      JAVA_OPTS: >-
        -XX:+UseZGC
        -XX:+ZGenerational
        -Xms512m
        -Xmx2g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    networks:
      - exam-network
    depends_on:
      - auth-service-1
      - auth-service-2
      - exam-service-1
      - exam-service-2
      - exam-service-3
      - redis-master
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: always

  # ============== WEBSOCKET SERVICE ==============
    healthcheck:
      # wget is in the alpine base image (curl is not)
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8080/actuator/health | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: exam-websocket-service
    ports:
      - "8084:8084"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (base64, at least 32 bytes)}
      JAVA_OPTS: >-
        -XX:+UseZGC
        -XX:+ZGenerational
        -Xms256m
        -Xmx1g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    networks:
      - exam-network
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    restart: always

  # ============== MONITORING ==============
    healthcheck:
      # wget is in the alpine base image (curl is not)
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8084/actuator/health | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: exam-monitoring-service
    ports:
      - "8083:8083"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_NAME: exam_monitoring
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (base64, at least 32 bytes)}
      JAVA_OPTS: >-
        -XX:+UseZGC
        -Xms256m
        -Xmx1g
    networks:
      - exam-network
    depends_on:
      postgres-primary:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    restart: always

  # ============== PROMETHEUS ==============
    healthcheck:
      # wget is in the alpine base image (curl is not)
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8083/actuator/health | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
  prometheus:
    image: prom/prometheus:latest
    container_name: exam-prometheus
    environment:
      TZ: UTC
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - exam-network
    restart: always

  # ============== GRAFANA ==============
  grafana:
    image: grafana/grafana:latest
    container_name: exam-grafana
    ports:
      - "3000:3000"
    environment:
      TZ: UTC
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - exam-network
    restart: always

networks:
  exam-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Explicit, fixed name: the database volume must not depend on the folder or project name.
  # NEVER remove it (no "down -v", no "docker volume rm") - see "Database safety" in README.md
  postgres_data:
    name: exam-system-prod_postgres_data
  # Question media files. Same rule as the database volume: explicit name, NEVER remove it.
  media_data:
    name: exam-system-prod_media_data
  redis_data:
  prometheus_data:
  grafana_data:
