          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: always
    healthcheck:
      # wget is in the alpine base image (curl is not)
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8082/actuator/health | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s

