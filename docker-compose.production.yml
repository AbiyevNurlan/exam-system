      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_NAME: exam_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (base64, at least 32 bytes)}
      # Shared secret for /internal/** between auth-service and exam-service (min 32 characters)
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      AUTH_INTERNAL_URL: http://auth-service-1:8081
      # Zone whose midnight starts a new day for the daily attempt limit of an exam
      EXAM_DAY_ZONE: ${EXAM_DAY_ZONE:-Asia/Baku}
      # Where the risk level of a session's fraud events turns MEDIUM, HIGH and CRITICAL (weighted sum)
