# =====================================================
# EXAM PORTAL - PRODUCTION DOCKER COMPOSE
# Optimized for 100,000 concurrent users
# =====================================================

# Its own project: started from this folder it must not take over the development/public stack
# (project exam-system; websocket-service and monitoring-service have the same names there).
name: exam-system-prod

services:
  # ============== LOAD BALANCER ==============
  nginx:
    image: nginx:alpine
    container_name: exam-nginx
    environment:
      TZ: UTC
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - exam-network
    depends_on:
      - api-gateway-1
      - api-gateway-2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: always

  # ============== POSTGRESQL CLUSTER ==============
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 5
  postgres-primary:
    image: postgres:16-alpine
    container_name: exam-postgres-primary
    environment:
      TZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_MULTIPLE_DATABASES: exam_auth,exam_db,exam_monitoring
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only creates the empty databases; tables come from each service's Flyway migrations
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - exam-network
    healthcheck:
      # TCP on purpose: during first-time initialisation Postgres only listens on its unix socket, so this
      # turns healthy only after init-scripts created the databases (Flyway in the services needs them)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d exam_monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    restart: always

  # ============== REDIS CLUSTER ==============
  redis-master:
    image: redis:7-alpine
    container_name: exam-redis-master
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    # The password goes into a config file inside the container, not onto the command line
    command: ["sh", "-c", "umask 077 && printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/auth.conf && exec redis-server /tmp/auth.conf --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --tcp-keepalive 300 --timeout 0 --tcp-backlog 511 --maxclients 10000 --save \"\""]
    volumes:
      - redis_data:/data
    networks:
      - exam-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    restart: always

  # ============== MEDIA STORAGE ==============
  # S3-compatible storage for question media (SeaweedFS, as in development). Private bucket; exam-service
  # creates it and signs every URL. Not published: browsers reach it only through the public endpoint
  # (MEDIA_S3_PUBLIC_ENDPOINT), which a reverse proxy must pass on unchanged (host and path are signed;
  # deploy/public/nginx.conf, location /exam-media/, shows how).
  media-storage:
    image: chrislusf/seaweedfs:4.48
    container_name: exam-media-storage-prod
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    environment:
      TZ: UTC
      AWS_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY:?MEDIA_S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_KEY:?MEDIA_S3_SECRET_KEY is required}
    volumes:
      - media_data:/data
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  # ============== AUTH SERVICE (2 instances) ==============
  auth-service-1:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: exam-auth-service-1
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_NAME: exam_auth
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (base64, at least 32 bytes)}
      # Shared secret for /internal/** between auth-service and exam-service (min 32 characters)
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      EXAM_INTERNAL_URL: http://exam-service-1:8082
      # Zone whose midnight starts a new day in the registration figures (same as exam-service)
      EXAM_DAY_ZONE: ${EXAM_DAY_ZONE:-Asia/Baku}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required (base64, at least 32 bytes)}
      # SMTP for verification emails (any provider); see .env.example
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      JAVA_OPTS: >-
        -XX:+UseZGC
        -XX:+ZGenerational
        -Xms512m
        -Xmx2g
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    networks:
      - exam-network
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: always
    healthcheck:
      # wget is in the alpine base image (curl is not)
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8081/actuator/health | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s

