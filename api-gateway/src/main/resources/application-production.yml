# =====================================================
# API GATEWAY - PRODUCTION CONFIGURATION
# Optimized for 100K concurrent users
# =====================================================

server:
  port: 8080
  netty:
    connection-timeout: 5000
    idle-timeout: 60000
    h2c-max-content-length: 65536

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  threads:
    virtual:
      enabled: true
  
  # ============== GATEWAY CONFIGURATION ==============
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
        pool:
          type: elastic
          max-idle-time: 30s
          max-life-time: 60s
          eviction-interval: 60s
          max-connections: 10000
          acquire-timeout: 30000
      
      # ============== CORS ==============
      globalcors:
        cors-configurations:
          '[/**]':
            # The sites that may call the API, comma separated (https://imtahan.example.az).
            # Required: without it the gateway does not start, there is no "*" in production.
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            # Read by the frontend: the row count and file name of the CSV export, the wait of a 429
            exposedHeaders:
              - Authorization
              - X-Request-Id
              - X-Total-Count
              - Content-Disposition
              - Retry-After
            allowCredentials: true
            maxAge: 3600
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestSize
          args:
            maxSize: 10MB
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
      
      # ============== ROUTES ==============
      # Every route has its own bucket per client address (RateLimiterConfig: route id + IP). The
      # route lists of this file and of application.yml must stay the same
      # (scripts\check-gateway-routes.ps1).
      routes:
        # Registration and sign-in: a school or exam hall registers hundreds of people through one
        # address. Capacities per address (GATEWAY_AUTH_*), defaults as the general auth route.
        - id: auth-register
          uri: lb://auth-service
          predicates:
            - Path=/auth/register
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_REGISTER_RATE:500}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_REGISTER_BURST:1000}
                redis-rate-limiter.requestedTokens: 1
        - id: auth-login
          uri: lb://auth-service
          predicates:
            - Path=/auth/login
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_LOGIN_RATE:500}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_LOGIN_BURST:1000}
                redis-rate-limiter.requestedTokens: 1
        # Verification codes: a much smaller budget per client IP than the rest of /auth (10 requests
        # at once, then one every 5 seconds). Must stay before the general auth route. Only .env may
        # loosen it (GATEWAY_OTP_REPLENISH tokens per second, GATEWAY_OTP_BURST; each request takes 5).
        # Limits per email address are enforced in auth-service (OtpService), not here.
        - id: auth-otp
          uri: lb://auth-service
          predicates:
            - Path=/auth/verify-otp, /auth/resend-otp, /auth/forgot-password, /auth/reset-password
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_OTP_REPLENISH:1}
                redis-rate-limiter.burstCapacity: ${GATEWAY_OTP_BURST:50}
                redis-rate-limiter.requestedTokens: 5
        # Password change: its own small bucket per client IP against guessing the current password with
        # a stolen token (5 at once, then one every 5 seconds). Must stay before the general auth route.
        - id: auth-password
          uri: lb://auth-service
          predicates:
            - Path=/auth/change-password
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_PASSWORD_REPLENISH:1}
                redis-rate-limiter.burstCapacity: ${GATEWAY_PASSWORD_BURST:25}
                redis-rate-limiter.requestedTokens: 5
        # AUTH SERVICE
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 500
                redis-rate-limiter.burstCapacity: 1000
                redis-rate-limiter.requestedTokens: 1

        # EXAM SERVICE
        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/api/exams/**, /api/questions/**, /api/results/**, /api/sessions/**, /api/admin/groups/**, /api/admin/participants/**, /api/groups/**, /api/join/**, /api/media/**, /api/analytics/**, /api/admin/audit/**, /api/grading/**, /api/me/**
          filters:
            - name: CircuitBreaker
              args:
                name: examCircuitBreaker
                fallbackUri: forward:/fallback/exam
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1000
                redis-rate-limiter.burstCapacity: 2000
                redis-rate-limiter.requestedTokens: 1

        # WEBSOCKET SERVICE
        - id: websocket-service
          uri: lb:ws://websocket-service
          predicates:
            - Path=/ws/**

        # MONITORING SERVICE
        - id: monitoring-service
          uri: lb://monitoring-service
          predicates:
            - Path=/api/monitoring/**

  # ============== REDIS ==============
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      connect-timeout: 5000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 30
          min-idle: 15
          max-wait: 3000ms

# ============== SERVICES AND CLIENT ADDRESS ==============
gateway:
  # The instances behind the lb:// routes (StaticDiscoveryClient): base URLs, comma separated
  services:
    auth-service: ${AUTH_SERVICE_URL:http://auth-service:8081}
    exam-service: ${EXAM_SERVICE_URL:http://exam-service:8082}
    websocket-service: ${WEBSOCKET_SERVICE_URL:http://websocket-service:8084}
    monitoring-service: ${MONITORING_SERVICE_URL:http://monitoring-service:8083}
  client-ip:
    # Behind nginx every request comes from nginx: without its address here all users would share
    # one rate limit bucket. IPs or CIDRs of the proxies whose X-Forwarded-For is believed.
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

# ============== RESILIENCE4J CIRCUIT BREAKER ==============
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        failureRateThreshold: 50
        waitDurationInOpenState: 30000
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5000
        recordExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      authCircuitBreaker:
        baseConfig: default
      examCircuitBreaker:
        baseConfig: default
        slidingWindowSize: 200
        failureRateThreshold: 40
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
    instances:
      authCircuitBreaker:
        baseConfig: default
        timeoutDuration: 10s
      examCircuitBreaker:
        baseConfig: default
        timeoutDuration: 60s

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 500
        maxWaitDuration: 100ms
    instances:
      authCircuitBreaker:
        baseConfig: default
        maxConcurrentCalls: 200
      examCircuitBreaker:
        baseConfig: default
        maxConcurrentCalls: 1000

# ============== ACTUATOR ==============
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ============== LOGGING ==============
logging:
  level:
    root: WARN
    com.examportal: INFO
    org.springframework.cloud.gateway: WARN
    io.netty: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
