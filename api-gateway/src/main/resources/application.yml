server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Development: any port of localhost (the Vite dev server and preview); a list of
            # origins can be given with CORS_ALLOWED_ORIGINS (comma separated, patterns allowed)
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            # Read by the frontend: the row count and file name of the CSV export, the wait of a 429
            exposedHeaders:
              - Authorization
              - X-Total-Count
              - Content-Disposition
              - Retry-After
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      # Every route has its own bucket per client address (RateLimiterConfig: route id + IP), so
      # one route running out never refuses another. The route lists of this file and of
      # application-production.yml must stay the same (scripts\check-gateway-routes.ps1).
      routes:
        # Registration and sign-in: a school or exam hall registers hundreds of people through one
        # address. Capacities per address (GATEWAY_AUTH_*), defaults as the general auth route.
        - id: auth-register
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/register
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_REGISTER_RATE:100}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_REGISTER_BURST:200}
                redis-rate-limiter.requestedTokens: 1
        - id: auth-login
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/login
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_LOGIN_RATE:100}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_LOGIN_BURST:200}
                redis-rate-limiter.requestedTokens: 1
        # Verification codes: a much smaller budget per client IP than the rest of /auth (10 requests
        # at once, then one every 5 seconds). Must stay before the general auth route.
        # Limits per email address are enforced in auth-service (OtpService), not here.
        - id: auth-otp
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/verify-otp, /auth/resend-otp, /auth/forgot-password, /auth/reset-password
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 50
                redis-rate-limiter.requestedTokens: 5
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1

        - id: exam-service
          uri: http://exam-service:8082
          predicates:
            - Path=/api/exams/**, /api/questions/**, /api/results/**, /api/sessions/**, /api/admin/groups/**, /api/admin/participants/**, /api/groups/**, /api/join/**, /api/media/**, /api/analytics/**, /api/admin/audit/**, /api/grading/**
          filters:
            - name: CircuitBreaker
              args:
                name: examCircuitBreaker
                fallbackUri: forward:/fallback/exam
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        - id: websocket-service
          uri: http://websocket-service:8084
          predicates:
            - Path=/ws/**

        - id: monitoring-service
          uri: http://monitoring-service:8083
          predicates:
            - Path=/api/monitoring/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 1000ms

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authCircuitBreaker:
        baseConfig: default
      examCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    # As in production: longer than the services' own timeouts (exam-service gives up on
    # auth-service after 5 s, 15 s for large lists), so a service's own error (503
    # USER_DIRECTORY_UNAVAILABLE) reaches the client instead of the gateway's generic fallback
    instances:
      authCircuitBreaker:
        baseConfig: default
        timeoutDuration: 10s
      examCircuitBreaker:
        baseConfig: default
        timeoutDuration: 60s

security:
  jwt:
    secret-key: ${JWT_SECRET:}

gateway:
  client-ip:
    # Proxies whose X-Forwarded-For is believed (IPs or CIDRs, comma separated). Empty: the
    # rate limiter counts the remote address of the connection (ClientIpResolver).
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.examportal: DEBUG
    org.springframework.cloud.gateway: DEBUG
    # This filter logs every request header at DEBUG, including the bearer token and X-User-Email
    org.springframework.cloud.gateway.filter.headers.observation: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
