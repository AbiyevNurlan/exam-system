# =====================================================
# NGINX LOAD BALANCER - 100K CONCURRENT USERS
# =====================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    # ============== BASIC SETTINGS ==============
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # ============== BUFFER SIZES ==============
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    output_buffers 1 32k;
    postpone_output 1460;

    # ============== TIMEOUTS ==============
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ============== GZIP COMPRESSION ==============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    # ============== RATE LIMITING ==============
    limit_req_zone $binary_remote_addr zone=api_limit:50m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:20m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # ============== UPSTREAM - API GATEWAYS ==============
    upstream api_gateway {
        least_conn;
        server api-gateway-1:8080 weight=5 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8080 weight=5 max_fails=3 fail_timeout=30s;
        keepalive 256;
    }

    # ============== UPSTREAM - WEBSOCKET ==============
    upstream websocket {
        ip_hash;
        server websocket-service:8084 max_fails=3 fail_timeout=30s;
        keepalive 128;
    }

    # ============== MAIN SERVER ==============
    server {
        listen 80;
        server_name _;

        # Connection limits
        limit_conn conn_limit 100;

        # ============== API ROUTES ==============
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 24k;
        }

        # ============== AUTH ROUTES ==============
        location /auth/ {
            limit_req zone=auth_limit burst=50 nodelay;
            
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ============== WEBSOCKET ROUTES ==============
        location /ws/ {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ============== HEALTH CHECK ==============
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ============== MONITORING ==============
        location /metrics {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
