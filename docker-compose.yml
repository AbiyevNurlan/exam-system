services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: exam-postgres
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: exam_auth,exam_db,exam_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only creates the empty databases; tables come from each service's Flyway migrations
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - exam-network
    healthcheck:
      # TCP on purpose: during first-time initialisation Postgres only listens on its unix socket, so this
      # turns healthy only after init-scripts created the databases (Flyway in the services needs them)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d exam_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: exam-redis
    environment:
      TZ: UTC
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit: local SMTP server that catches every email (development only, nothing is delivered).
  # Both ports are bound to 127.0.0.1, so the mailbox is not reachable from other machines.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: exam-mailpit
    environment:
      TZ: UTC
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI and API
    networks:
      - exam-network

  # SeaweedFS: S3-compatible object storage for question media (development).
  # Only the S3 API is published, on 127.0.0.1 only. The credentials are the storage's root
  # identity and have no default: without them in .env the stack refuses to start.
  # The bucket is private; exam-service creates it (and its CORS rules) at startup.
  media-storage:
    image: chrislusf/seaweedfs:4.48
    container_name: exam-media-storage
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      TZ: UTC
      AWS_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY:?MEDIA_S3_ACCESS_KEY is required - copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_KEY:?MEDIA_S3_SECRET_KEY is required - copy .env.example to .env}
    ports:
      - "127.0.0.1:8333:8333"   # S3 API (presigned URLs point here in development)
    volumes:
      - media_data:/data
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: exam-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      # Optional: first ADMIN is created on startup when both are set (no default values)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required - copy .env.example to .env}
      # Email. Without MAIL_HOST in .env every email goes to the local Mailpit (http://localhost:8025)
      # and nothing is delivered. With MAIL_HOST set to a real SMTP server, set the port and the
      # MAIL_SMTP_AUTH / MAIL_STARTTLS / MAIL_SSL switches with it (the defaults here fit Mailpit only)
      # and MAIL_FROM, without which auth-service refuses to start. See .env.example.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-false}
      # Optional: shared secret for /internal/** between auth-service and exam-service (min 32 characters)
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      EXAM_INTERNAL_URL: http://exam-service:8082
      # Zone whose midnight starts a new day in the registration figures (same as exam-service)
      EXAM_DAY_ZONE: ${EXAM_DAY_ZONE:-Asia/Baku}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_auth
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Exam Service
  exam-service:
    build:
      context: .
      dockerfile: Dockerfile.exam
    container_name: exam-exam-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      # Optional: without it, adding group members by email and the CSV import answer 503
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      AUTH_INTERNAL_URL: http://auth-service:8081
      # Question media. MEDIA_S3_ENDPOINT is how this service reaches the storage; the public endpoint
      # is the host inside presigned URLs and must be reachable from the browser.
      MEDIA_S3_ENDPOINT: http://media-storage:8333
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      MEDIA_S3_BUCKET: exam-media
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?MEDIA_S3_ACCESS_KEY is required - copy .env.example to .env}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?MEDIA_S3_SECRET_KEY is required - copy .env.example to .env}
      # Frontend origins that may upload/download directly at the storage (comma separated)
      MEDIA_CORS_ORIGINS: ${MEDIA_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Confirmed media that no exam uses is removed after this many days; 0 or less = never
      MEDIA_ORPHAN_RETENTION_DAYS: ${MEDIA_ORPHAN_RETENTION_DAYS:-14}
      # Zone whose midnight starts a new day for the daily attempt limit of an exam
      EXAM_DAY_ZONE: ${EXAM_DAY_ZONE:-Asia/Baku}
      # Where the risk level of a session's fraud events turns MEDIUM, HIGH and CRITICAL (weighted sum)
      EXAM_FRAUD_RISK_MEDIUM: ${EXAM_FRAUD_RISK_MEDIUM:-5}
      EXAM_FRAUD_RISK_HIGH: ${EXAM_FRAUD_RISK_HIGH:-15}
      EXAM_FRAUD_RISK_CRITICAL: ${EXAM_FRAUD_RISK_CRITICAL:-30}
      # Most rows a CSV export of an exam's results may have (more answers 422)
      EXAM_RESULTS_EXPORT_MAX_ROWS: ${EXAM_RESULTS_EXPORT_MAX_ROWS:-50000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-storage:
        condition: service_healthy

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: exam-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Optional (.env.example, section Gateway); the defaults are those of api-gateway application.yml
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      GATEWAY_AUTH_REGISTER_RATE: ${GATEWAY_AUTH_REGISTER_RATE:-100}
      GATEWAY_AUTH_REGISTER_BURST: ${GATEWAY_AUTH_REGISTER_BURST:-200}
      GATEWAY_AUTH_LOGIN_RATE: ${GATEWAY_AUTH_LOGIN_RATE:-100}
      GATEWAY_AUTH_LOGIN_BURST: ${GATEWAY_AUTH_LOGIN_BURST:-200}
    networks:
      - exam-network
    depends_on:
      - auth-service
      - exam-service
      - redis

  # WebSocket Service
  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: exam-websocket-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      redis:
        condition: service_healthy

  # Monitoring Service
  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: exam-monitoring-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_monitoring
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  exam-network:
    driver: bridge

volumes:
  # Explicit, fixed name: the database volume must not depend on the folder or project name.
  # NEVER remove it (no "down -v", no "docker volume rm") - see "Database safety" in README.md
  postgres_data:
    name: exam-system_postgres_data
  # Question media files. Same rule as the database volume: explicit name, NEVER remove it.
  media_data:
    name: exam-system_media_data
  redis_data: