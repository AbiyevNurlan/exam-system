services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: exam_auth,exam_db,exam_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - exam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: exam-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: exam-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      # Optional: first ADMIN is created on startup when both are set (no default values)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_auth
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Exam Service
  exam-service:
    build:
      context: .
      dockerfile: Dockerfile.exam
    container_name: exam-exam-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: exam-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      - auth-service
      - exam-service
      - redis

  # WebSocket Service
  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: exam-websocket-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      redis:
        condition: service_healthy

  # Monitoring Service
  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: exam-monitoring-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_monitoring
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - exam-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  exam-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: