# Edge of the temporary public mode (docker-compose.public.yml, docs/PUBLIC_TEMP.md).
# One origin: the frontend build at /, the API at /api/ and /auth/ (gateway), presigned media at
# /exam-media/ (storage). Nothing else of the stack is reachable through it.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    # Client address. Only the tunnel container (fixed address on the tunnel network) may name the
    # client with CF-Connecting-IP, which Cloudflare sets itself and overwrites when a client sends
    # one. From anywhere else (the local check port) the header is ignored and the peer is the client.
    set_real_ip_from 172.28.1.11;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # No query strings in the log: presigned media URLs carry their signature there
    log_format edge '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout edge;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 5m;

    # A request with an Origin is accepted only from this site itself (scheme ignored: the tunnel is
    # https, the local check port http). Any other origin is refused here, so the gateway never sees
    # a cross-site request and CORS is not needed (docs/PUBLIC_TEMP.md, "CORS").
    map "$http_origin|$http_host" $cross_origin {
        "~^\|"                  0;
        "~^https?://([^|/]+)\|\1$" 0;
        default                 1;
    }

    upstream gateway {
        server api-gateway:8080;
        keepalive 16;
    }

    upstream media {
        server media-storage:8333;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        include /etc/nginx/security-headers.conf;

        # Management and internal paths of any service: never through the edge
        location ~* (^|/)(internal|actuator|fallback|api-docs|swagger-ui|swagger-ui\.html|v3)(/|$) {
            return 404;
        }

        # The frontend calls /api/auth/*, the gateway serves /auth/* (as the Vite dev proxy does)
        location /api/auth/ {
            if ($cross_origin) { return 403; }
            rewrite ^/api(/auth/.*)$ $1 break;
            proxy_pass http://gateway;
            include /etc/nginx/proxy-gateway.conf;
        }

        location /auth/ {
            if ($cross_origin) { return 403; }
            proxy_pass http://gateway;
            include /etc/nginx/proxy-gateway.conf;
        }

        location /api/ {
            if ($cross_origin) { return 403; }
            proxy_pass http://gateway;
            include /etc/nginx/proxy-gateway.conf;
        }

        # Presigned media (exam-service signs URLs for this origin, path style /exam-media/<key>).
        # Only signed GET/HEAD/PUT pass; the storage checks the signature, which covers the host and
        # the path, so both reach it unchanged. The upload size is part of the signature as well;
        # the cap here is the request limit of Cloudflare's tunnel.
        location /exam-media/ {
            if ($args !~ "(^|&)X-Amz-Signature=") { return 404; }
            if ($cross_origin) { return 403; }
            limit_except GET PUT { deny all; }
            client_max_body_size 100m;
            proxy_pass http://media;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header CF-Connecting-IP "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Build output with a content hash in the name: cached for good, never the SPA fallback
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Single page application: every other path is a client route (deep links, refresh)
        location / {
            try_files $uri /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
    }
}
