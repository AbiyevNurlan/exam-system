# Request to the gateway (locations /api/, /api/auth/, /auth/ of nginx.conf).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Same-site requests only reach this point (nginx.conf, $cross_origin): the gateway gets no Origin
proxy_set_header Origin "";
# The client address as the edge decided it (real_ip): one address, replacing whatever the client
# sent. The gateway believes it only from the edge (GATEWAY_TRUSTED_PROXIES).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header CF-Connecting-IP "";
proxy_connect_timeout 5s;
# Longer than the gateway's own limits (exam route 60 s), so its answer arrives
proxy_read_timeout 75s;
proxy_send_timeout 75s;
