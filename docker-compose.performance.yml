# Performance configuration: one instance of every service with tuned Postgres and Redis and
# Prometheus/Grafana, for load tests on one machine. Its own database volume
# (exam-system-perf_postgres_data); never the development or production data.
#
# Scaling out (several gateways and services behind nginx) is docker-compose.production.yml; this
# file runs one instance per service: a fixed container_name cannot be replicated, and the
# nginx/nginx.conf upstreams (api-gateway-1/-2) belong to the production file.
# Every port is bound to 127.0.0.1 only. The gateway uses 127.0.0.1:8080 like the development and
# public stacks: stop those first (never with "down -v").
#
#   docker compose -f docker-compose.performance.yml config --quiet    (check)
#   docker compose -f docker-compose.performance.yml up -d --build
#
# Its own project name and container names (exam-perf-*): started from this folder it must never
# take over the containers of the development/public stack (project exam-system), whose services
# have the same names (postgres, redis, ...).
name: exam-system-perf

services:
  # PostgreSQL - Optimized for High Load
  postgres:
    image: postgres:16-alpine
    container_name: exam-perf-postgres
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: exam_db
      # Read by init-scripts/01-create-databases.sh (exam_db already exists through POSTGRES_DB)
      POSTGRES_MULTIPLE_DATABASES: exam_auth,exam_monitoring
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only creates the empty databases; tables and indexes come from each service's Flyway migrations
      - ./init-scripts:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      # TCP on purpose: during first-time initialisation Postgres only listens on its unix socket, so this
      # turns healthy only after init-scripts created the databases (Flyway in the services needs them)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d exam_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-network

  # Redis - High-Performance Caching
  redis:
    image: redis:7-alpine
    container_name: exam-perf-redis
    environment:
      TZ: UTC
    command:
      - "redis-server"
      - "--maxmemory"
      - "4gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
      - "--save"
      - "60 1000"
      - "--tcp-backlog"
      - "511"
      - "--timeout"
      - "300"
      - "--tcp-keepalive"
      - "60"
      - "--maxclients"
      - "10000"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - exam-network

  # Prometheus - Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: exam-perf-prometheus
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - exam-network

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: exam-perf-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: UTC
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - exam-network

  # API Gateway (production profile: lb:// routes to the single instances below)
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: exam-perf-api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      AUTH_SERVICE_URL: http://auth-service:8081
      EXAM_SERVICE_URL: http://exam-service:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # A load generator on this machine is one address: without a trusted proxy it shares one bucket
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      GATEWAY_AUTH_REGISTER_RATE: ${GATEWAY_AUTH_REGISTER_RATE:-500}
      GATEWAY_AUTH_REGISTER_BURST: ${GATEWAY_AUTH_REGISTER_BURST:-1000}
      GATEWAY_AUTH_LOGIN_RATE: ${GATEWAY_AUTH_LOGIN_RATE:-500}
      GATEWAY_AUTH_LOGIN_BURST: ${GATEWAY_AUTH_LOGIN_BURST:-1000}
    depends_on:
      - auth-service
      - exam-service
      - redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - exam-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: exam-perf-auth-service
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_auth
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # auth-service refuses to start without it
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      EXAM_INTERNAL_URL: http://exam-service:8082
      # No mail server here: every send fails cleanly (load tests verify accounts by SQL)
      MAIL_HOST: ${MAIL_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - exam-network

  # Exam Service
  exam-service:
    build:
      context: .
      dockerfile: Dockerfile.exam
    container_name: exam-perf-exam-service
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      AUTH_INTERNAL_URL: http://auth-service:8081
      # Zone whose midnight starts a new day for the daily attempt limit of an exam
      EXAM_DAY_ZONE: ${EXAM_DAY_ZONE:-Asia/Baku}
      # Where the risk level of a session's fraud events turns MEDIUM, HIGH and CRITICAL (weighted sum)
      EXAM_FRAUD_RISK_MEDIUM: ${EXAM_FRAUD_RISK_MEDIUM:-5}
      EXAM_FRAUD_RISK_HIGH: ${EXAM_FRAUD_RISK_HIGH:-15}
      EXAM_FRAUD_RISK_CRITICAL: ${EXAM_FRAUD_RISK_CRITICAL:-30}
      # No media storage here: media endpoints answer 503
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    networks:
      - exam-network

  # Monitoring Service (port 8083)
  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: exam-perf-monitoring-service
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: exam_monitoring
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - exam-network

  # WebSocket Service (port 8084)
  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: exam-perf-websocket-service
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      SPRING_PROFILES_ACTIVE: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - exam-network

volumes:
  # Explicit, fixed name: the database volume must not depend on the folder or project name.
  # NEVER remove it (no "down -v", no "docker volume rm") - see "Database safety" in README.md
  postgres_data:
    name: exam-system-perf_postgres_data
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  exam-network:
    driver: bridge
