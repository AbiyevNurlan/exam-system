server:
  port: 8081

spring:
  application:
    name: auth-service
  main:
    web-application-type: reactive
  threads:
    virtual:
      enabled: true
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exam_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      validation-query: SELECT 1
  # Schema migrations (db/migration). Flyway connects over JDBC with the same settings as R2DBC and runs
  # before the application serves requests; any failure aborts startup.
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exam_auth}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    connect-retries: 10
  # Outgoing email over plain SMTP (any provider). Without MAIL_HOST no email is sent and the failure is logged.
  # The defaults fit a real provider on port 587; docker-compose.yml overrides them for the local Mailpit.
  # MailSettings checks the combination at startup.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      # STARTTLS (port 587): required, not only used when offered, so a connection is never downgraded
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      # Implicit TLS (port 465)
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 1000ms

security:
  jwt:
    secret-key: ${JWT_SECRET:}
    access-token-expiration: 900000   # 15 minutes
    refresh-token-expiration: 604800000  # 7 days
    issuer: exam-system

# Shared secret for the service-to-service endpoints under /internal/** (at least 32 characters).
# Empty = those endpoints are switched off.
internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

# exam-service keeps the user groups; a verified login reports there so pending group invites are applied
services:
  exam:
    url: ${EXAM_INTERNAL_URL:http://localhost:8082}

auth:
  lockout:
    max-attempts: 5        # wrong passwords before the account is locked
    duration-minutes: 15   # 0 = locked until an admin unlocks
  otp:
    # Key for the HMAC under which codes are stored: base64 of at least 32 random bytes.
    # Required: the service refuses to start without it.
    hmac-secret: ${OTP_HMAC_SECRET:}
    ttl-minutes: 10              # how long a code is valid
    max-attempts: 5              # wrong codes before the code is burned
    resend-cooldown-seconds: 60  # minimum time between two codes for one email
    max-sends-per-hour: 5        # codes per email per hour
  cleanup:
    enabled: true                # daily housekeeping job (AccountCleanupJob)
    cron: "0 30 3 * * *"         # every day at 03:30
    run-on-startup: true         # also once after every start
    otp-retention-days: 7        # email_otp rows older than this are deleted
    unverified-max-age-days: 14  # unverified accounts older than this are deactivated (never deleted)
  mail:
    from: ${MAIL_FROM:}          # sender address of every email; required unless the host is Mailpit
    from-name: ${MAIL_FROM_NAME:}  # display name of the sender
    reply-to: ${MAIL_REPLY_TO:}  # optional Reply-To address
  bootstrap:
    # First ADMIN, created on startup only when both are set and no ADMIN exists yet
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

management:
  health:
    # The mail server being down must not take the service out of rotation
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.examportal: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
