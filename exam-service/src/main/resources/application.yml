server:
  port: 8082

spring:
  application:
    name: exam-service
  main:
    web-application-type: reactive
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  sql:
    init:
      mode: never
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exam_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      validation-query: SELECT 1
  # Schema migrations (db/migration). Flyway connects over JDBC with the same settings as R2DBC and runs
  # before the application serves requests; any failure aborts startup.
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exam_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    connect-retries: 10
  data:
    redis:
      enabled: true
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 1000ms

security:
  jwt:
    secret-key: ${JWT_SECRET:}

# Service-to-service calls. Users live in auth-service, so emails and user ids are resolved through
# its internal endpoint, authenticated with a shared secret (at least 32 characters).
# Empty secret = adding group members by email or id and the CSV import answer 503.
services:
  auth:
    url: ${AUTH_INTERNAL_URL:http://localhost:8081}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

exam:
  settings:
    max-questions-per-exam: 100
    max-duration-minutes: 180
    auto-submit-buffer-seconds: 30
    result-cache-ttl-minutes: 60
  # The zone whose midnight starts a new day for the daily attempt limit (exams.max_attempts_per_day).
  # Dates stay UTC everywhere; this only decides where one day ends and the next begins.
  day-zone: ${EXAM_DAY_ZONE:Asia/Baku}
  fraud:
    # Events a participant's browser reports during a session (POST .../session/{id}/fraud-event)
    max-events-per-session: 300       # further events are accepted (202) but not stored
    max-events-per-minute: 60         # per session; more answers 429
    # Risk level of a session from the weighted sum of its events (weights: FraudRiskPolicy).
    # LOW below medium-from, MEDIUM below high-from, HIGH below critical-from, CRITICAL from there.
    risk:
      medium-from: ${EXAM_FRAUD_RISK_MEDIUM:5}
      high-from: ${EXAM_FRAUD_RISK_HIGH:15}
      critical-from: ${EXAM_FRAUD_RISK_CRITICAL:30}
  groups:
    # After a rejected join request the same user may ask that group again only this many hours later;
    # 0 or less = at once (GroupJoinService)
    join-reject-cooldown-hours: ${GROUP_JOIN_REJECT_COOLDOWN_HOURS:24}
  results:
    # Most rows a CSV export of an exam's results may have; more is refused with 422 RESULTS_EXPORT_TOO_LARGE
    export-max-rows: ${EXAM_RESULTS_EXPORT_MAX_ROWS:50000}
  blocks:
    # B12b: the participant side of blocks (block timers, breaks, fixed navigation, returning to earlier
    # blocks; SessionBlockService). false turns it off: an exam that needs it then cannot be published
    # (409 FEATURE_NOT_AVAILABLE).
    rules-enabled: ${EXAM_BLOCK_RULES_ENABLED:true}
  # B13: what one teacher may own unless an administrator sets other limits (PUT /api/admin/instructor-limits/{id});
  # members are distinct people in the own groups, pending invites included; ADMIN has no limits
  instructor-limits:
    max-groups: ${EXAM_TEACHER_MAX_GROUPS:50}
    max-members: ${EXAM_TEACHER_MAX_MEMBERS:2000}
    max-exams: ${EXAM_TEACHER_MAX_EXAMS:200}
    max-media-bytes: ${EXAM_TEACHER_MAX_MEDIA_BYTES:1073741824}
  history:
    # B12a: changeReason (3-500 characters) is optional on every change of an exam. With this on, a sensitive
    # change (answer key, points, duration, window, block timers and rules, publish, archive) of a SCHEDULED
    # or ACTIVE exam needs one: 400 CHANGE_REASON_REQUIRED.
    require-change-reason-after-publish: ${REQUIRE_CHANGE_REASON_AFTER_PUBLISH:false}
  media:
    # Allowed uploads: IMAGE jpeg/png/webp, AUDIO mp3/ogg/m4a, VIDEO mp4 (MediaTypePolicy)
    image-max-bytes: 5242880          # 5 MB
    audio-max-bytes: 20971520         # 20 MB
    video-max-bytes: 209715200        # 200 MB
    upload-url-ttl-seconds: 600       # presigned PUT
    avatar-max-bytes: 2097152         # 2 MB, a profile picture (jpeg/png/webp)
    avatar-url-ttl-seconds: 3600      # presigned GET of the own profile picture
    preview-url-ttl-seconds: 300      # presigned GET for owner/ADMIN
    session-url-ttl-seconds: 300      # presigned GET for a participant inside a session
    max-pending-per-user: 50          # unconfirmed uploads one user may have
    pending-max-age-minutes: 60       # an unconfirmed upload older than this is removed
    cleanup-interval-ms: 300000       # how often the cleanup runs
    # Confirmed files that no exam (drafts included) uses are removed after this many days.
    # 0 or less switches that cleanup off.
    orphan-retention-days: ${MEDIA_ORPHAN_RETENTION_DAYS:14}
    orphan-cleanup-interval-ms: 1800000   # how often the orphan cleanup runs (at most 200 files per run)
    # S3-compatible object storage for question media (SeaweedFS in development). Files go straight
    # from the browser to the storage with presigned URLs; this service keeps only the metadata.
    # Without endpoint and credentials the service starts and media endpoints answer 503.
    storage:
      endpoint: ${MEDIA_S3_ENDPOINT:}                 # how this service reaches the storage
      public-endpoint: ${MEDIA_S3_PUBLIC_ENDPOINT:}   # host inside presigned URLs; must be reachable from the browser
      region: ${MEDIA_S3_REGION:us-east-1}
      bucket: ${MEDIA_S3_BUCKET:exam-media}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      # Frontend origins allowed to PUT/GET directly at the storage (comma separated); written to the bucket at startup
      cors-allowed-origins: ${MEDIA_CORS_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.examportal: DEBUG
    org.springframework.r2dbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
