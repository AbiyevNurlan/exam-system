server:
  port: 8082

spring:
  application:
    name: exam-service
  main:
    web-application-type: reactive
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  sql:
    init:
      mode: never
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exam_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      validation-query: SELECT 1
  # Schema migrations (db/migration). Flyway connects over JDBC with the same settings as R2DBC and runs
  # before the application serves requests; any failure aborts startup.
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exam_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    connect-retries: 10
  data:
    redis:
      enabled: true
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 1000ms

security:
  jwt:
    secret-key: ${JWT_SECRET:}

# Service-to-service calls. Users live in auth-service, so emails and user ids are resolved through
# its internal endpoint, authenticated with a shared secret (at least 32 characters).
# Empty secret = adding group members by email or id and the CSV import answer 503.
services:
  auth:
    url: ${AUTH_INTERNAL_URL:http://localhost:8081}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

exam:
  settings:
    max-questions-per-exam: 100
    max-duration-minutes: 180
    auto-submit-buffer-seconds: 30
    result-cache-ttl-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.examportal: DEBUG
    org.springframework.r2dbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
